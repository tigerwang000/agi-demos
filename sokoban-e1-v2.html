<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sokoban — E-004</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a24; color: #e8e8e8; font-family: ui-monospace, Menlo, monospace;
         display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
  #game { border: 2px solid #3a3a55; background: #101018; }
  #hud { display: flex; gap: 24px; font-size: 15px; }
  #hud b { color: #ffd86b; }
  #msg { min-height: 1.4em; font-size: 14px; color: #9f9fb8; }
  #solved { color: #7dff8a; font-weight: bold; }
  #keys { font-size: 12px; color: #6a6a85; }
</style>
</head>
<body>
<div id="hud"><span>Moves <b id="moves">0</b></span><span>Pushes <b id="pushes">0</b></span></div>
<canvas id="game" width="360" height="360"></canvas>
<div id="msg">arrow keys / WASD to move — push all boxes onto goals ( / )</div>
<div id="keys">R restarts — N next level (when solved)</div>
<script>
"use strict";
// E-004 Sokoban runner — renders a level JSON (inlined below), plays the
// fixed Sokoban rules, and exposes a tiny state API for acceptance harnesses:
//   window.__state() -> { solved, moves, pushes, boxesOnGoals, totalGoals }
// Deterministic, zero dependencies, single file (E-001 module discipline).
const LEVELS = [{"name": "Easy Stroll", "width": 8, "height": 7, "cells": ["########", "#......#", "#..$...#", "#..@...#", "#.(....#", "#......#", "########"]}, {"name": "Supply Run", "width": 8, "height": 7, "cells": ["########", "#......#", "#..$...#", "#..@...#", "#.(.($.#", "#......#", "########"]}];
const TILE = 40; // canvas 360 -> 9 cols max
const COLORS = {
  wall: "#3a3a55", floor: "#191926", goal: "#2b4a2b",
  box: "#c98a3d", boxOnGoal: "#7dff8a", player: "#6bb8ff", grid: "#22222f",
};
const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
const $ = (id) => document.getElementById(id);
let lv, player, boxes, moves, pushes;

function load(i) {
  lv = { ...LEVELS[i] };
  player = null; boxes = [];
  moves = 0; pushes = 0;
  const goals = [];
  lv.cells.forEach((row, y) => {
    for (let x = 0; x < row.length; x++) {
      const c = row[x];
      if (c === "@" || c === "+") player = { x, y };
      if (c === "$" || c === "*") boxes.push({ x, y });
      if (c === "*" || c === "+" || c === "(" || c === ")") goals.push({ x, y });
    }
  });
  lv.goals = goals;
  cv.width = lv.width * TILE; cv.height = lv.height * TILE;
  draw();
  sync();
}
const isWall = (x, y) => lv.cells[y][x] === "#";
const boxAt = (x, y) => boxes.find((b) => b.x === x && b.y === y);
const onGoal = (b) => lv.goals.some((g) => g.x === b.x && g.y === b.y);
function sync() {
  $("moves").textContent = String(moves);
  $("pushes").textContent = String(pushes);
  const done = boxes.length > 0 && boxes.every(onGoal);
  $("msg").innerHTML = done ? '<span id="solved">SOLVED — all boxes on goals</span>'
    : "arrow keys / WASD to move — push all boxes onto goals ( / )";
}
function draw() {
  for (let y = 0; y < lv.height; y++) {
    for (let x = 0; x < lv.width; x++) {
      const c = lv.cells[y][x];
      const g = lv.goals.some((gg) => gg.x === x && gg.y === y);
      ctx.fillStyle = c === "#" ? COLORS.wall : g ? COLORS.goal : COLORS.floor;
      ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
      if (g && c !== "#") { // goal marker: hollow square
        ctx.strokeStyle = "#4a7a4a"; ctx.lineWidth = 2;
        ctx.strokeRect(x * TILE + 12, y * TILE + 12, TILE - 24, TILE - 24);
      }
    }
  }
  for (const b of boxes) {
    ctx.fillStyle = onGoal(b) ? COLORS.boxOnGoal : COLORS.box;
    ctx.fillRect(b.x * TILE + 6, b.y * TILE + 6, TILE - 12, TILE - 12);
    ctx.strokeStyle = "#00000055"; ctx.strokeRect(b.x * TILE + 6, b.y * TILE + 6, TILE - 12, TILE - 12);
  }
  ctx.fillStyle = COLORS.player;
  ctx.beginPath();
  ctx.arc(player.x * TILE + TILE / 2, player.y * TILE + TILE / 2, TILE / 3, 0, Math.PI * 2);
  ctx.fill();
}
const DIRS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
               w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0], W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0] };
function step(dx, dy) {
  const nx = player.x + dx, ny = player.y + dy;
  if (isWall(nx, ny)) return;
  const b = boxAt(nx, ny);
  if (b) {
    const tx = nx + dx, ty = ny + dy;
    if (isWall(tx, ty) || boxAt(tx, ty)) return;
    b.x = tx; b.y = ty; pushes++;
  }
  player.x = nx; player.y = ny; moves++;
  draw(); sync();
}
let current = 0; // E-006 C2: multi-level — R restarts current, N advances when solved
document.addEventListener("keydown", (e) => {
  if (e.key === "r" || e.key === "R") { load(current); return; }
  if (e.key === "n" || e.key === "N") {
    const st = window.__state();
    if (st.solved && current + 1 < LEVELS.length) { current++; load(current); }
    return;
  }
  const d = DIRS[e.key];
  if (!d) return;
  e.preventDefault();
  step(d[0], d[1]);
});
window.__state = () => ({ solved: boxes.length > 0 && boxes.every(onGoal), moves, pushes,
  boxesOnGoals: boxes.filter(onGoal).length, totalGoals: lv.goals.length,
  level: lv.name, levelIndex: current, levelCount: LEVELS.length });
load(0);
</script>
</body>
</html>
